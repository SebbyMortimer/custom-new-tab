<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <title>Sebby's Custom New Tab Page</title>
    </head>
    <body>
        <img id="piplup" src="images/piplup-swimming.gif" alt="Animation of the Pokemon Piplup swimming">

        <div id="icebergContainer">
            <img id="iceberg" src="images/iceberg.png" alt="Graphic of an iceberg">

            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; width: 100%;">
                <h1 style="margin: 0; font-family: Tahoma; font-size: 5vw; color: #52b5ff;">Chill</h1>

                <form id="searchForm">
                    <input type="search" name="q" autofocus required>
                    <input type="submit" value="Search" style="margin-bottom: 0.5vw;">
                    <br>
                    <label for="language">Language</label>
                    <select name="language" id="language">
                        <option value="en">English</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                        <option value="es">Español</option>
                        <option value="ja">日本語</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="pt">Português</option>
                    </select>
                    <label for="hideAI">Hide AI overview</label>
                    <input type="checkbox" name="hideAI" id="hideAI">
                </form>
            </div>

            <img class="iceHole" style="top: 30%; left: 30%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 50%; left: 15%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 80%; left: 50%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 60%; left: 81%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
        </div>

        <div style="position: absolute; left: 20px; top: 20px; display: flex; flex-direction: column;">
            <iframe id="piplupVideo" width="560" height="315"
                    src="https://www.youtube.com/embed/z4ZI8T4BstI?si=uUGrAXpbBgoIJyMS"
                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
            </iframe>

            <img src="images/sebby-suggests.png" alt="Sebby suggests" style="width: 10vw; position: absolute; bottom: -30%; right: 20%; transform: rotate(-10deg);">
        </div>

        <div id="wotd-container">
            <img style="width: 20vw;" src="images/Iceberg-upside-down.png" alt="Graphic of an iceberg">
            <div id="wotd-div">
                <h2 style="font-size: 1.5vw; margin: 0.5vw 0;">Word of the Day</h2>
                <a id="word-link"><h1 id="wotd-word" style="font-size: 2vw; margin: 0.5vw 0;">Loading...</h1></a>
                <p id="wotd-def" style="font-size: 1vw; margin: 0.75vw 0;"></p>
                <a href="https://www.wordnik.com/" style="position: absolute; right: 3vw;"><img style="width: 7vw;" src="images/wordnik_badge_a2.png" alt="Graphic of an iceberg"></a>
            </div>
        </div>

        <div id="bottom-right-container">
            <!-- <div id="wotd-div">
                <h2>Word of the Day</h2>
                <h1 id="wotd-word">Loading...</h1>
                <p id="wotd-def"></p>
            </div> -->
            <img id="charles" src="images/charles/charles-idle.png" alt="Click for music" onmouseover="ToggleCharlesThumbs(true)" onmouseleave="ToggleCharlesThumbs(false)" onmousedown="ToggleBGMusic()">
        </div>

        <audio id="backgroundMusic" loop>
            <source src="audio/triceratops-recovery.flac" type="audio/flac">
            Your browser does not support the audio tag.
        </audio>
        <script src="scripts/main.js"></script>
        <script src="scripts/script.js"></script>
        <script src="scripts/waves.js"></script>
        <script src="scripts/piplup.js"></script>
    </body>
</html>
