<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>Water website test</title>
    </head>
    <body>
        <img id="piplup" src="images/piplup-swimming.gif" alt="Animation of the Pokemon Piplup swimming">

        <div id="icebergContainer">
            <img id="iceberg" src="images/iceberg.png" alt="Graphic of an iceberg">

            <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center;">
                <h1 style="margin: 0; font-family: Tahoma; font-size: 5vw; color: #52b5ff;">Chill</h1>

                <form id="searchForm">
                    <input type="search" name="q" autofocus required>
                    <input type="submit" value="Search">
                    <br>
                    <label for="language">Language</label>
                    <select name="language" id="language">
                        <option value="en">English</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                        <option value="es">Español</option>
                        <option value="ja">日本語</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                        <option value="pt">Português</option>
                    </select>
                    <label for="hideAI">Hide AI overview</label>
                    <input type="checkbox" name="hideAI" id="hideAI">
                </form>
            </div>

            <img class="iceHole" style="top: 30%; left: 30%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 50%; left: 15%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 70%; left: 50%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
            <img class="iceHole" style="top: 60%; left: 80%" src="images/ice-hole.png" alt="Graphic of a hole in ice">
        </div>

        <iframe id="piplupVideo" width="560" height="315"
                src="https://www.youtube.com/embed/z4ZI8T4BstI?si=uUGrAXpbBgoIJyMS"
                title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen>
        </iframe>

        <div id="bottom-right-container">
            <div id="wotd-div">
                <h2>Word of the Day</h2>
                <h1>Penguin</h1>
                <p>Definition</p>
            </div>
            <img id="charles" src="images/charles/charles-idle.png" alt="Click for music" onmouseover="ToggleCharlesThumbs(true)" onmouseleave="ToggleCharlesThumbs(false)" onmousedown="ToggleBGMusic()">
        </div>

        <audio id="backgroundMusic" loop>
            <source src="audio/triceratops-recovery.flac" type="audio/flac">
            Your browser does not support the audio tag.
        </audio>
        <script src="scripts/main.js"></script>
        <script src="scripts/script.js"></script>
        <script src="scripts/waves.js"></script>
